name: Keep Alive

# Render's free tier spins a Web Service down after 15 minutes of inactivity. This pings
# both services every 10 minutes — comfortably inside that window — to keep them warm.
# See docs/SETUP_RENDER.md for the RENDER_API_URL / RENDER_WEB_URL repo variables this needs.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          if [ -z "${{ vars.RENDER_API_URL }}" ]; then
            echo "RENDER_API_URL repo variable is not set — skipping backend ping."
          else
            curl -fsS --max-time 30 "${{ vars.RENDER_API_URL }}/health"
          fi

      - name: Ping frontend health check
        run: |
          if [ -z "${{ vars.RENDER_WEB_URL }}" ]; then
            echo "RENDER_WEB_URL repo variable is not set — skipping frontend ping."
          else
            curl -fsS --max-time 30 "${{ vars.RENDER_WEB_URL }}/api/health"
          fi
